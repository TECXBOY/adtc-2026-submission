<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASSCE/BECE Offline Tutor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --border: #d8d8d0;
      --accent: #1a6b3a;       /* deep green — West African flag palette */
      --accent-light: #e8f5ec;
      --text: #1a1a18;
      --muted: #6b6b60;
      --user-bg: #1a6b3a;
      --user-text: #ffffff;
      --bot-bg: #ffffff;
      --bot-border: #d8d8d0;
      --error: #c0392b;
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--accent);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header p  { font-size: 12px; opacity: 0.85; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #aaa; flex-shrink: 0; margin-left: auto;
      transition: background 0.3s;
    }
    .status-dot.online  { background: #5dde7a; }
    .status-dot.loading { background: #f0c040; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 760px;
      width: 100%;
      align-self: flex-start;
    }
    .message.user  { align-self: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.7;
    }
    .user  .bubble { background: var(--user-bg); color: var(--user-text); border-radius: 12px 12px 2px 12px; }
    .bot   .bubble { background: var(--bot-bg); border: 1px solid var(--bot-border); border-radius: 12px 12px 12px 2px; }
    .error .bubble { background: #fdf0ef; border: 1px solid #f5c6c2; color: var(--error); }

    .meta-tag {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      padding-left: 2px;
    }

    .cursor::after {
      content: "▋";
      animation: blink 0.9s step-start infinite;
      color: var(--accent);
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Input bar ── */
    #input-bar {
      padding: 12px 20px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #question {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
      max-height: 140px;
      outline: none;
      transition: border-color 0.2s;
    }
    #question:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .hint { font-size: 12px; color: var(--muted); text-align: center; padding: 0 0 4px; }

    /* ── Intro placeholder ── */
    #intro {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 400px;
    }
    #intro h2 { font-size: 18px; color: var(--accent); margin-bottom: 8px; }
    #intro p  { font-size: 13px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>WASSCE/BECE Offline Tutor</h1>
    <p>Mathematics &amp; Integrated Science · Offline · No internet required</p>
  </div>
  <span class="status-dot" id="status-dot" title="Server status"></span>
</header>

<div id="chat">
  <div id="intro">
    <h2>Ask a question</h2>
    <p>Type any WASSCE or BECE Mathematics or Integrated Science question and get a full step-by-step solution.</p>
  </div>
</div>

<div id="input-bar">
  <textarea id="question" rows="1" placeholder="e.g. Find the area of a circle with radius 7cm (π = 22/7)" maxlength="4000"></textarea>
  <button id="send-btn">Send</button>
</div>
<p class="hint">Shift+Enter for new line · Enter to send</p>

<script>
  const API = 'http://127.0.0.1:8000';
  const chat    = document.getElementById('chat');
  const intro   = document.getElementById('intro');
  const textarea = document.getElementById('question');
  const sendBtn  = document.getElementById('send-btn');
  const dot      = document.getElementById('status-dot');

  let busy = false;

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
  });

  // ── Send on Enter (not Shift+Enter) ───────────────────────────────────────
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  sendBtn.addEventListener('click', submit);

  // ── Health check ─────────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/healthz`);
      dot.className = r.ok ? 'status-dot online' : 'status-dot';
    } catch { dot.className = 'status-dot'; }
  }
  checkHealth();
  setInterval(checkHealth, 10000);

  // ── Add message bubble ────────────────────────────────────────────────────
  function addMessage(role, text, metaText) {
    intro.style.display = 'none';
    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrapper.appendChild(bubble);
    if (metaText) {
      const meta = document.createElement('div');
      meta.className = 'meta-tag';
      meta.textContent = metaText;
      wrapper.appendChild(meta);
    }
    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  async function submit() {
    const question = textarea.value.trim();
    if (!question || busy) return;

    busy = true;
    sendBtn.disabled = true;
    dot.className = 'status-dot loading';

    addMessage('user', question);
    textarea.value = '';
    textarea.style.height = 'auto';

    // Bot bubble (streaming)
    const botBubble = addMessage('bot', '');
    botBubble.classList.add('cursor');
    let answer = '';
    let retrievedIds = [];

    try {
      const resp = await fetch(`${API}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      if (!resp.ok) {
        const err = await resp.json();
        botBubble.classList.remove('cursor');
        botBubble.closest('.message').className = 'message error';
        botBubble.textContent = err.detail || 'Server error.';
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.event === 'meta') {
            retrievedIds = payload.retrieved_ids || [];
          } else if (payload.event === 'token') {
            answer += payload.text;
            botBubble.textContent = answer;
            chat.scrollTop = chat.scrollHeight;
          } else if (payload.event === 'error') {
            answer += `\n[Error: ${payload.detail}]`;
            botBubble.textContent = answer;
          } else if (payload.event === 'done') {
            break;
          }
        }
      }
    } catch (err) {
      botBubble.closest('.message').className = 'message error';
      botBubble.textContent = `Could not connect to the local server. Make sure it is running:\n\n.venv/bin/python -m uvicorn backend.serve:app --host 127.0.0.1 --port 8000`;
    } finally {
      botBubble.classList.remove('cursor');
      if (retrievedIds.length) {
        const meta = document.createElement('div');
        meta.className = 'meta-tag';
        meta.textContent = `Related: ${retrievedIds.join(', ')}`;
        botBubble.closest('.message').appendChild(meta);
      }
      busy = false;
      sendBtn.disabled = false;
      dot.className = 'status-dot online';
      textarea.focus();
    }
  }
</script>
</body>
</html>
