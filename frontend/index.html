<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASSCE/BECE Tutor</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --bg:           #f9f9f8;
      --surface:      #ffffff;
      --border:       #e5e4e0;
      --border-light: #eeede9;

      --text:         #1c1c1a;
      --text-muted:   #7a7872;
      --text-faint:   #b0afa8;

      /* user message — warm neutral tint, not a strong color */
      --user-bg:      #f0efe9;
      --user-text:    #1c1c1a;

      /* assistant message — pure white, left-aligned */
      --bot-bg:       #ffffff;

      /* accent used very sparingly */
      --accent:       #2d6a4f;
      --accent-hover: #245a42;

      --error-bg:     #fef2f2;
      --error-border: #fecaca;
      --error-text:   #b91c1c;

      --radius-msg:   10px;
      --radius-input: 10px;

      /* column */
      --col-width:    740px;
    }

    /* ── Base ── */
    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      /* prevent horizontal scroll on narrow viewports */
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      /* centered column */
      display: flex;
      justify-content: center;
    }
    .header-inner {
      width: 100%;
      max-width: var(--col-width);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .header-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    /* status indicator — right-aligned, very subtle */
    .status-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.4s;
    }
    .status-dot.online  { background: #4ade80; }
    .status-dot.loading { background: #fbbf24; }

    /* ── Chat scroll area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      /* column centering */
      display: flex;
      flex-direction: column;
      align-items: center;
      /* extra padding at bottom so last message clears the input bar */
      padding: 32px 20px 24px;
      gap: 0;
      scroll-behavior: smooth;
    }

    /* ── Empty state ── */
    #empty-state {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
      width: 100%;
      max-width: 520px;
      padding: 40px 0 20px;
    }
    .empty-heading {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .empty-sub {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 380px;
    }
    /* prompt chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      text-align: left;
      line-height: 1.4;
    }
    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #f0f7f3;
    }

    /* ── Message group (one full turn) ── */
    .msg-group {
      width: 100%;
      max-width: var(--col-width);
      padding: 18px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .msg-group:last-child { border-bottom: none; }

    /* ── Message row ── */
    .msg-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    /* avatar / label */
    .msg-label {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-top: 1px;
      user-select: none;
    }
    .msg-row.user  .msg-label { background: var(--user-bg);  color: var(--text-muted); }
    .msg-row.bot   .msg-label { background: #e8f5ee; color: var(--accent); }
    .msg-row.error .msg-label { background: var(--error-bg); color: var(--error-text); }

    /* message text */
    .msg-text {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user  .msg-text { color: var(--user-text); }
    .msg-row.error .msg-text { color: var(--error-text); font-size: 14px; }

    /* ── Thinking indicator ── */
    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }
    .thinking span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40%            { opacity: 1;    transform: scale(1);    }
    }

    /* ── Cursor blink during streaming ── */
    .streaming::after {
      content: "▍";
      font-size: 14px;
      animation: blink 0.8s step-start infinite;
      color: var(--text-faint);
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Corpus tags (post-response) ── */
    .corpus-tag {
      margin-top: 10px;
      padding-left: 42px; /* align with msg-text (28px label + 14px gap) */
      font-size: 12px;
      color: var(--text-faint);
    }

    /* ── Input area ── */
    #input-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: center;
      padding: 14px 20px 18px;
    }
    #input-inner {
      width: 100%;
      max-width: var(--col-width);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 10px 12px 10px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input-box:focus-within {
      border-color: #b0cfc0;
      box-shadow: 0 0 0 3px #e8f3ee;
    }
    #question {
      flex: 1;
      resize: none;
      border: none;
      background: transparent;
      outline: none;
      font: inherit;
      font-size: 15px;
      line-height: 1.55;
      color: var(--text);
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
    }
    #question::placeholder { color: var(--text-faint); }

    #send-btn {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s;
      padding: 0;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    /* inline SVG arrow — no external icon CDN */
    #send-btn svg {
      width: 16px; height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-hint {
      font-size: 11.5px;
      color: var(--text-faint);
      text-align: center;
    }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header>
  <div class="header-inner">
    <div>
      <div class="header-title">WASSCE / BECE Tutor</div>
      <div class="header-sub">Mathematics &amp; Integrated Science · fully offline</div>
    </div>
    <div class="status-wrap">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-label">connecting…</span>
    </div>
  </div>
</header>

<!-- ── Chat ──────────────────────────────────────────────────── -->
<div id="chat">
  <div id="empty-state">
    <div>
      <div class="empty-heading">What would you like to solve?</div>
      <p class="empty-sub">Ask any WASSCE or BECE Mathematics or Integrated Science question and get a full worked solution.</p>
    </div>
    <div class="chips">
      <button class="chip" data-q="Solve x² − 5x + 6 = 0 by factorization. Show all working.">Quadratic equation</button>
      <button class="chip" data-q="Find the area of a circle with radius 7 cm. Take π = 22/7.">Area of a circle</button>
      <button class="chip" data-q="State Newton's Second Law of Motion and write its mathematical expression.">Newton's Second Law</button>
      <button class="chip" data-q="A trader bought 40 mangoes at ₦5 each and sold them at ₦8 each. Calculate the profit percent.">Profit percentage</button>
      <button class="chip" data-q="Write the word equation for photosynthesis.">Photosynthesis equation</button>
      <button class="chip" data-q="Find the 12th term of the arithmetic progression: 2, 5, 8, 11, …">Arithmetic progression</button>
    </div>
  </div>
</div>

<!-- ── Input ──────────────────────────────────────────────────── -->
<div id="input-wrap">
  <div id="input-inner">
    <div id="input-box">
      <textarea
        id="question"
        rows="1"
        placeholder="Ask a WASSCE or BECE question…"
        maxlength="4000"
        spellcheck="true"
        autocomplete="off"
      ></textarea>
      <button id="send-btn" title="Send (Enter)" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>
</div>

<script>
'use strict';

// Use the same origin the page was loaded from — works for both
// localhost (http://127.0.0.1:8000) and LAN mode (http://192.168.x.x:8000).
const API      = window.location.origin;
const chat     = document.getElementById('chat');
const emptyEl  = document.getElementById('empty-state');
const textarea = document.getElementById('question');
const sendBtn  = document.getElementById('send-btn');
const dot      = document.getElementById('status-dot');
const statusLbl= document.getElementById('status-label');

let busy = false;

// ── Prompt chips ────────────────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    textarea.value = chip.dataset.q;
    autoResize();
    textarea.focus();
    submit();
  });
});

// ── Auto-resize textarea ─────────────────────────────────────────────────────
function autoResize() {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
}
textarea.addEventListener('input', autoResize);

// ── Keyboard ─────────────────────────────────────────────────────────────────
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
sendBtn.addEventListener('click', submit);

// ── Health check ─────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch(`${API}/healthz`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      dot.className = 'status-dot online';
      statusLbl.textContent = 'ready';
    } else {
      dot.className = 'status-dot';
      statusLbl.textContent = 'error';
    }
  } catch {
    dot.className = 'status-dot';
    statusLbl.textContent = 'offline';
  }
}
checkHealth();
setInterval(checkHealth, 12000);

// ── DOM helpers ───────────────────────────────────────────────────────────────
function hideEmpty() {
  emptyEl.style.display = 'none';
}

/** Create a message group (wrapper for one question or one answer). */
function addGroup(role, initialText) {
  hideEmpty();
  const group = document.createElement('div');
  group.className = 'msg-group';

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'AI';
  label.setAttribute('aria-hidden', 'true');

  const textEl = document.createElement('div');
  textEl.className = 'msg-text';
  if (initialText) textEl.textContent = initialText;

  row.appendChild(label);
  row.appendChild(textEl);
  group.appendChild(row);
  chat.appendChild(group);
  scrollToBottom();

  return { group, row, textEl };
}

/** Replace textEl content with a pulsing "thinking" indicator. */
function showThinking(textEl) {
  textEl.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'thinking';
  t.innerHTML = '<span></span><span></span><span></span>';
  textEl.appendChild(t);
  return t;
}

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

// ── Submit ────────────────────────────────────────────────────────────────────
async function submit() {
  const question = textarea.value.trim();
  if (!question || busy) return;

  busy = true;
  sendBtn.disabled = true;
  dot.className = 'status-dot loading';
  statusLbl.textContent = 'thinking…';

  // User message
  addGroup('user', question);
  textarea.value = '';
  textarea.style.height = 'auto';

  // Bot placeholder
  const { group: botGroup, textEl: botText } = addGroup('bot', '');
  const thinkingEl = showThinking(botText);

  let answer = '';
  let retrievedIds = [];
  let firstToken = true;

  try {
    const resp = await fetch(`${API}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: 'Server error.' }));
      thinkingEl.remove();
      botText.textContent = err.detail || 'Something went wrong.';
      botGroup.querySelector('.msg-row').className = 'msg-row error';
      botGroup.querySelector('.msg-label').textContent = '!';
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let payload;
        try { payload = JSON.parse(line.slice(6)); } catch { continue; }

        if (payload.event === 'meta') {
          retrievedIds = payload.retrieved_ids || [];
        } else if (payload.event === 'token') {
          if (firstToken) {
            // Remove thinking indicator, start streaming text
            thinkingEl.remove();
            botText.textContent = '';
            botText.classList.add('streaming');
            firstToken = false;
          }
          answer += payload.text;
          botText.textContent = answer;
          scrollToBottom();
        } else if (payload.event === 'error') {
          if (firstToken) thinkingEl.remove();
          answer += `\n[${payload.detail}]`;
          botText.textContent = answer;
        } else if (payload.event === 'done') {
          break;
        }
      }
    }

  } catch (err) {
    thinkingEl.remove();
    botText.textContent =
      'Could not reach the local server.\n\n' +
      'Start it with:\n' +
      '  .venv/bin/python3 -m uvicorn backend.serve:app --host 127.0.0.1 --port 8000';
    botGroup.querySelector('.msg-row').className = 'msg-row error';
    botGroup.querySelector('.msg-label').textContent = '!';
  } finally {
    botText.classList.remove('streaming');

    // Corpus reference tag — very subtle, below the answer
    if (retrievedIds.length) {
      const tag = document.createElement('div');
      tag.className = 'corpus-tag';
      tag.textContent = 'Related: ' + retrievedIds.join(', ');
      botGroup.appendChild(tag);
    }

    busy = false;
    sendBtn.disabled = false;
    checkHealth();
    textarea.focus();
  }
}
</script>
</body>
</html>
