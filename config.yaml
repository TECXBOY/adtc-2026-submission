# config.yaml — single source of truth for runtime settings
# Edit this to swap models/quant levels during Step 2 candidate testing.

hardware_budget:
  ram_ceiling_gb: 7.0          # hard ceiling — never target exactly this
  ram_safety_margin_gb: 1.0    # design against ceiling minus this margin
  cpu_only: true                # no code path may assume GPU availability

model:
  # Chosen at Step 2 — see DECISIONS.md for full candidate comparison.
  # gguf_path must match _runtime.model_path in metadata.json exactly.
  active: "SmolLM2-1.7B-Instruct"
  gguf_path: "model/SmolLM2-1.7B-Instruct-Q4_K_M.gguf"
  quantization: "Q4_K_M"        # provisional — revisit at Step 7
  context_window: 2048
  # Candidates evaluated (kept for record; remove before final submission)
  candidates_evaluated:
    - name: "SmolLM2-1.7B-Instruct Q4_K_M"
      result: "CHOSEN — 5/5 correct, 2.5 t/s, 1346 MB peak RAM"
    - name: "Gemma-2-2B-it Q4_K_M"
      result: "REJECTED — 1/5 within timeout, 1.6 t/s, 1948 MB peak RAM"
    - name: "Phi-3.5-mini-instruct Q4_K_M"
      result: "NOT TESTED — download incomplete"

rag:
  corpus_path: "./corpus/wassce_bece_questions.jsonl"
  vector_index_path: "./corpus/index"
  embedding_model: "EMBEDDING_MODEL_PLACEHOLDER"  # must be local, no external API
  top_k: 3
  chunk_size_tokens: 256
  chunk_overlap_tokens: 32

inference:
  max_new_tokens: 512
  stream: true
  temperature: 0.2               # low temp — favor correctness over variety
  stop_sequences: []

server:
  host: "127.0.0.1"              # localhost only, never 0.0.0.0
  port: 8000
  allow_network: false           # hard flag — assert this at startup

robustness:
  max_input_chars: 4000
  reject_empty_input: true
  request_timeout_seconds: 60
